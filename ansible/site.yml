---
# DevOps Lab - Complete Infrastructure Automation
# This playbook automates:
# 1. System updates and dependencies
# 2. Docker Engine installation
# 3. Application deployment via Docker Compose

- name: DevOps Lab - Complete Deployment
  hosts: all
  become: yes
  gather_facts: yes
  
  vars:
    # Docker configuration
    docker_install_compose: true
    docker_users:
      - "{{ ansible_user_id }}"
    
    # Fail fast on errors
    ansible_failed_when_result_is_unreachable: true

  pre_tasks:
    - name: Check if running with sudo privileges
      shell: whoami
      register: current_user
      changed_when: false

  roles:
    - common
    - geerlingguy.docker
    - webapp

  post_tasks:
    - name: Display deployment summary
      debug:
        msg:
          - "✓ Deployment completed successfully"
          - "Instance: {{ ansible_hostname }}"
